[package]
name = "master-prompt-manager"
version = "1.0.0"
edition = "2021"

[lib]
name = "master_prompt_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
